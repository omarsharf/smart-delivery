{% extends 'delivery/base.html' %}
{% load static %}

{% block title %}تسجيل الخروج — أوردري{% endblock %}

{% block content %}
<div class="glass pad" style="max-width: 440px; margin: 5rem auto; text-align: center; border-radius: 16px;">
    
    <div style="font-size: 2.8rem; margin-bottom: 0.8rem; display: inline-block; background: rgba(255, 255, 255, 0.05); padding: 0.8rem; border-radius: 50%;">
        👋
    </div>

    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 600;">نشوفك على خير قريب!</h2>
    
    <p class="muted" style="font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
        تم تسجيل خروجك بنجاح من حسابك في <strong>أوردري</strong>.<br>
        شكراً لوقتك معنا، وتقدر ترجع في أي وقت.
    </p>

    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
        <a href="{% url 'login' %}" class="btn" style="text-align: center; justify-content: center;">
            تسجيل الدخول مرة ثانية
        </a>
        <a href="{% url 'home' %}" class="btn btn-ghost" style="text-align: center; justify-content: center; background: transparent; border: 1px solid var(--line);">
            الرجوع للصفحة الرئيسية
        </a>
    </div>

</div>
{% endblock %}
