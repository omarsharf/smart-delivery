{% extends "delivery/base.html" %}

{% block name %}تسجيل الخروج — توصيل ذكي{% endblock %}

{% block content %}
<div class="card" style="max-width: 440px; margin: 4rem auto; text-align: center; padding: 2.5rem 1.5rem;">
    <div style="font-size: 3rem; margin-bottom: 1rem; display: inline-block; background: #f8fafc; width: 80px; height: 80px; line-height: 80px; border-radius: 50%;">
        👋
    </div>

    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: bold;">نشوفك على خير قريب!</h2>
    
    <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
        تم تسجيل خروجك بنجاح من حسابك في <strong>توصيل ذكي</strong>.<br>
        شكراً لوقتك معنا، وتقدر ترجع في أي وقت.
    </p>

    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
        <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%;">
            تسجيل الدخول مرة ثانية
        </a>
        <a href="{% url 'home' %}" class="btn" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-main); width: 100%;">
            الرجوع للصفحة الرئيسية
        </a>
    </div>
</div>
{% endblock %}
