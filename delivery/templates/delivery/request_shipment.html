{% extends "delivery/base.html" %}

{% block name %}طلب شحنة جديدة — توصيل ذكي{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">طلب شحنة جديدة 📦</h1>
    <p class="page-sub">أملا البيانات وهنحدد لك أفضل سائق في الميعاد اللي تختاره</p>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <div style="margin-top: 1.5rem; text-align: left;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">إرسال الطلب 🚀</button>
        </div>
    </form>
</div>
{% endblock %}
